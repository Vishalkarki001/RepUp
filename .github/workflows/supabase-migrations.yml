# Applies new database migrations to the live Supabase project automatically.
#
# Runs when a push to main changes supabase/migrations/ (or this file), and can
# also be started by hand: GitHub → Actions → "Database migrations" → Run workflow.
#
# Needs two repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – from supabase.com → Account → Access Tokens
#   SUPABASE_DB_PASSWORD   – the project's database password
#
# Only migrations that haven't been applied yet are run, in filename order.
# If a migration fails, the job stops with an error and nothing after it runs (the website keeps working).

name: Database migrations

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - '.github/workflows/supabase-migrations.yml'
  workflow_dispatch:

# Never run two migration jobs at the same time.
concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: wmqbujfohlpkwrdotdfx
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Link the Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # The first two migrations were applied by hand before this automation existed.
      # Mark them as applied so they are never run again (safe to repeat).
      - name: Record the migrations applied by hand
        run: supabase migration repair --status applied 20261112000000 20261112010000 --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Show what will run
        run: supabase db push --dry-run --remote --password "$SUPABASE_DB_PASSWORD"

      - name: Apply new migrations
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD"
