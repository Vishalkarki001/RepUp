<!-- Supabase → Authentication → Emails → Templates → "Reset password"
     Subject: Reset your RepUp password
     The link uses token_hash so it works even when opened on a different phone/browser. -->
<div style="margin:0;padding:32px 16px;background:#f5f5f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0a0a0a">
  <div style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #e5e5e5;border-radius:16px;overflow:hidden">
    <div style="background:#0b0a1f;padding:24px;text-align:center">
      <div style="font-size:26px;font-weight:800;font-style:italic;letter-spacing:-0.5px;color:#ffffff">Rep<span style="color:#a78bfa">Up</span></div>
    </div>
    <div style="padding:28px 24px">
      <h1 style="margin:0 0 12px;font-size:20px">Reset your password</h1>
      <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#404040">
        Someone asked to reset the password for your RepUp account. Tap the button to choose a new one.
      </p>
      <p style="margin:0 0 24px;text-align:center">
        <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery"
           style="display:inline-block;background:#7c3aed;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 28px;border-radius:10px">
          Choose a new password
        </a>
      </p>
      <p style="margin:0;font-size:13px;line-height:1.6;color:#737373">
        Didn’t ask for this? Ignore this email; your password stays the same. The link works for 1 hour.
      </p>
    </div>
  </div>
  <p style="max-width:480px;margin:16px auto 0;text-align:center;font-size:12px;color:#a3a3a3">RepUp · Free gym workout tracker</p>
</div>
